<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pathfinder</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div class="shell">
      <aside class="sidebar" id="sidebar">
        <a class="brand" href="#/">
          <span class="brand-mark">PF</span>
          <span class="brand-name">Pathfinder</span>
        </a>
        <nav id="nav" class="side-nav" aria-label="Primary"></nav>
        <div class="sidebar-foot">
          <a href="#/sample">Sample journey</a>
          <span class="env">Internal · Pages</span>
        </div>
      </aside>
      <div class="main-wrap">
        <header class="topbar">
          <button type="button" class="icon-btn" id="nav-toggle" aria-label="Menu">Menu</button>
          <div class="page-meta">
            <div class="crumb" id="crumb">Overview</div>
            <p class="page-purpose" id="purpose"></p>
          </div>
          <div class="chrome" id="chrome">
            <label class="chrome-run">
              <span>Run</span>
              <select id="run-picker" aria-label="Selected run"></select>
            </label>
            <button type="button" class="btn" id="run-latest" title="Clear sticky selection and use latest published run">Latest</button>
            <span class="chrome-age" id="data-age" title="Workshop data freshness">—</span>
            <a class="btn" id="dispatch-publish" href="#">Publish</a>
            <a class="btn" id="dispatch-assist" href="#">Assist</a>
          </div>
          <div class="top-actions" id="top-actions"></div>
        </header>
        <main id="app" class="app"></main>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
