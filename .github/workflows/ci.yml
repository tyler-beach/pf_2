name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-and-assess:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Test and validate catalog
        run: |
          go test ./...
          go vet ./...
          go run ./cmd/adrctl validate --requirements adr/requirements.json

      - name: Assess repository source
        run: |
          go run ./cmd/adrctl assess-repo \
            --root . \
            --requirements adr/requirements.json \
            --report report.md \
            --json-out assessment.json \
            --sarif-out results.sarif
          cat report.md

      - name: Install pinned reviewdog CLI
        if: github.event_name == 'pull_request'
        run: go install github.com/reviewdog/reviewdog/cmd/reviewdog@v0.20.3

      - name: Annotate pull request with SARIF findings
        if: github.event_name == 'pull_request'
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ github.token }}
        run: reviewdog -f=sarif -reporter=github-pr-review -level=warning < results.sarif

      - name: Upload assessment evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: adr-repository-assessment
          path: |
            assessment.json
            results.sarif
            report.md
          if-no-files-found: error
          retention-days: 14
