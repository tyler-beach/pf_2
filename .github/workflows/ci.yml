name: CI

on:
  push:
    branches:
      - main
      - 'integration/**'
  pull_request:

permissions:
  contents: read

jobs:
  test-and-assess:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # reviewdog github-pr-review only on same-repo PRs; unused on push.
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Check gofmt on changed Go lines
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          if [ -n "${BASE_SHA:-}" ] && ! [[ "$BASE_SHA" =~ ^0+$ ]]; then
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
          fi
          python3 -m unittest discover -s scripts -p 'test_*.py'
          python3 scripts/check_gofmt_changed.py --base-sha "${BASE_SHA:-}" --head-sha "$GITHUB_SHA"

      - name: Test and validate catalog
        run: |
          ./scripts/go_test.sh -race -coverprofile=coverage.out
          go tool cover -func=coverage.out | tail -n 1
          go vet $(go list ./... | grep -v '/node_modules/')
          go run ./cmd/adrctl validate --requirements adr/requirements.json

      - name: Fuzz parsers with bounded smoke campaigns
        run: |
          go test ./internal/adringest -run=^$ -fuzz=FuzzParseADRMarkdown -fuzztime=5s
          go test ./internal/analyzer -run=^$ -fuzz=FuzzParseSARIF -fuzztime=5s
          go test ./internal/assessment -run=^$ -fuzz=FuzzParseIssueMarkdown -fuzztime=5s

      - name: Verify source-cited obligation candidates are deterministic and review-only
        run: |
          set -euo pipefail
          go run ./cmd/adrctl ingest-adrs --root testdata/adr-corpus --json-out "$RUNNER_TEMP/adr-ingested.json"
          go run ./cmd/adrctl extract-obligations --index "$RUNNER_TEMP/adr-ingested.json" --root testdata/adr-corpus --json-out "$RUNNER_TEMP/obligation-candidates.json"
          go run ./cmd/adrctl extract-obligations --index "$RUNNER_TEMP/adr-ingested.json" --root testdata/adr-corpus --json-out "$RUNNER_TEMP/obligation-candidates-second.json"
          cmp "$RUNNER_TEMP/obligation-candidates.json" "$RUNNER_TEMP/obligation-candidates-second.json"
          jq -e '
            .schema_version == "1"
            and .document_count == 2
            and .candidate_count >= 3
            and ([.candidates[] | select(.approval_status != "pending_review" or .enforcement_mode != "review_required" or .executable != false)] | length) == 0
            and ([.candidates[].source_sha256] | all(length == 64))
            and ([.candidates[].source_line_start] | all(. > 0))
          ' "$RUNNER_TEMP/obligation-candidates.json"

      - name: Verify source-bound obligation review registry
        run: |
          set -euo pipefail
          go run ./cmd/adrctl review-init --output "$RUNNER_TEMP/obligation-reviews.json"
          candidate_id="$(jq -er '.candidates[0].id' "$RUNNER_TEMP/obligation-candidates.json")"
          jq -n --arg candidate_id "$candidate_id" '{
            candidate_id: $candidate_id,
            decision: "pending_review",
            enforcement_mode: "review_required",
            reviewer: "ci-regression",
            reviewed_at: "2026-10-27T12:00:00Z",
            review_reference: "https://github.com/tyler-beach/pf_2/issues/19",
            rationale: "Candidate extraction is not approval; CI preserves review-required state."
          }' > "$RUNNER_TEMP/review-proposal.json"
          go run ./cmd/adrctl record-obligation-review \
            --index "$RUNNER_TEMP/obligation-candidates.json" \
            --requirements adr/requirements.json \
            --registry "$RUNNER_TEMP/obligation-reviews.json" \
            --proposal "$RUNNER_TEMP/review-proposal.json" \
            --coverage-out "$RUNNER_TEMP/obligation-review-coverage.json"
          go run ./cmd/adrctl validate-obligation-reviews \
            --index "$RUNNER_TEMP/obligation-candidates.json" \
            --requirements adr/requirements.json \
            --registry "$RUNNER_TEMP/obligation-reviews.json" \
            --json-out "$RUNNER_TEMP/obligation-review-coverage-validated.json" \
            --strict
          jq -e '
            .candidate_count >= 3
            and .pending_review_count == .candidate_count
            and .approved_count == 0
            and .blocking_binding_count == 0
            and .stale_count == 0
            and .orphaned_count == 0
            and .unbound_count == .candidate_count
          ' "$RUNNER_TEMP/obligation-review-coverage-validated.json"

      - name: Install pinned OpenGrep CLI and verify SHA-256
        run: |
          set -euo pipefail
          install_dir="$RUNNER_TEMP/opengrep"
          mkdir -p "$install_dir"
          curl --fail --location --silent --show-error \
            https://github.com/opengrep/opengrep/releases/download/v1.30.0/opengrep_manylinux_x86 \
            --output "$install_dir/opengrep"
          echo "35779bdd72e92129c8df2a77f0c55e8c08356801ea92591ef32108d6b28d564c  $install_dir/opengrep" | sha256sum --check
          chmod 0755 "$install_dir/opengrep"
          echo "$install_dir" >> "$GITHUB_PATH"
          "$install_dir/opengrep" --version

      - name: Verify OpenGrep against multilingual vulnerable and clean fixtures
        run: |
          set -euo pipefail
          fixture_root="$RUNNER_TEMP/pathfinder-opengrep-fixtures"
          mkdir -p "$fixture_root/vulnerable/rules" "$fixture_root/clean/rules"
          # Copy language fixtures only; IaC lives under iac/ and is exercised by Checkov.
          find testdata/analyzer-fixtures/vulnerable -maxdepth 1 -type f -exec cp {} "$fixture_root/vulnerable/" \;
          find testdata/analyzer-fixtures/clean -maxdepth 1 -type f -exec cp {} "$fixture_root/clean/" \;
          cp rules/pathfinder-security.yml "$fixture_root/vulnerable/rules/pathfinder-security.yml"
          cp rules/pathfinder-security.yml "$fixture_root/clean/rules/pathfinder-security.yml"

          go run ./cmd/adrctl scan-opengrep \
            --root "$fixture_root/vulnerable" \
            --config rules/pathfinder-security.yml \
            --binary "$RUNNER_TEMP/opengrep/opengrep" \
            --binary-sha256 35779bdd72e92129c8df2a77f0c55e8c08356801ea92591ef32108d6b28d564c \
            --version 1.30.0 \
            --json-out "$RUNNER_TEMP/opengrep-vulnerable.json" \
            --sarif-out "$RUNNER_TEMP/opengrep-vulnerable.sarif"

          go run ./cmd/adrctl scan-opengrep \
            --root "$fixture_root/clean" \
            --config rules/pathfinder-security.yml \
            --binary "$RUNNER_TEMP/opengrep/opengrep" \
            --binary-sha256 35779bdd72e92129c8df2a77f0c55e8c08356801ea92591ef32108d6b28d564c \
            --version 1.30.0 \
            --json-out "$RUNNER_TEMP/opengrep-clean.json" \
            --sarif-out "$RUNNER_TEMP/opengrep-clean.sarif"

          echo "Observed OpenGrep findings by rule and path:"
          jq -r '.findings[] | [.rule_id, .path, (.start_line|tostring)] | @tsv' "$RUNNER_TEMP/opengrep-vulnerable.json"
          echo "Observed OpenGrep languages and counts:"
          jq -r '[.findings[] | (.path | split(".")[-1])] | group_by(.) | map({language:.[0], count:length})' "$RUNNER_TEMP/opengrep-vulnerable.json"
          jq -e '
            .status == "COMPLETE"
            and (.findings | length) >= 40
            and (
              ([.findings[].rule_id] | unique) | length
            ) >= 40
            and (
              [
                "rules.pathfinder.bash-dynamic-eval",
                "rules.pathfinder.c-shell-command",
                "rules.pathfinder.cpp-shell-command",
                "rules.pathfinder.csharp-process-start",
                "rules.pathfinder.dart-process-run",
                "rules.pathfinder.elixir-dynamic-eval",
                "rules.pathfinder.go-shell-command",
                "rules.pathfinder.java-runtime-exec",
                "rules.pathfinder.kotlin-runtime-exec",
                "rules.pathfinder.lua-dynamic-eval",
                "rules.pathfinder.no-dynamic-eval",
                "rules.pathfinder.ocaml-system-command",
                "rules.pathfinder.python-dynamic-eval",
                "rules.pathfinder.ruby-dynamic-eval",
                "rules.pathfinder.rust-shell-command",
                "rules.pathfinder.scala-runtime-exec",
                "rules.pathfinder.swift-shell-command",
                "rules.pathfinder.visualbasic-process-start",
                "rules.pathfinder.owasp-md5-python",
                "rules.pathfinder.owasp-hardcoded-aws-key",
                "rules.pathfinder.aws-s3-public-read-acl-python",
                "rules.pathfinder.owasp-ssrf-http-get-python"
              ] - ([.findings[].rule_id] | unique) | length
            ) == 0
          ' "$RUNNER_TEMP/opengrep-vulnerable.json"

          # Distinct rule IDs are not enough for shared multi-language rules: require
          # a positive finding in every advertised language-specific vulnerable fixture.
          jq -e '
            .status == "COMPLETE"
            and ([.findings[].path | capture("\\.(?<extension>[^/.]+)$").extension] | unique | sort) == [
              "bash", "c", "cpp", "cs", "dart", "ex", "go", "java", "js", "kt",
              "lua", "ml", "php", "py", "rb", "rs", "scala", "swift", "ts", "vb"
            ]
          ' "$RUNNER_TEMP/opengrep-vulnerable.json"

          jq -e '.status == "COMPLETE" and (.findings | length) == 0' "$RUNNER_TEMP/opengrep-clean.json"

      - name: Prove Checkov adapter on IaC fixtures
        run: |
          set -euo pipefail
          # Dedicated venv: adrctl's ExecCommandRunner isolates HOME, so a pip
          # --user console script under ~/.local/bin cannot import checkov.
          checkov_venv="$RUNNER_TEMP/checkov-venv"
          python3 -m venv "$checkov_venv"
          "$checkov_venv/bin/python" -m pip install --disable-pip-version-check --no-input "checkov==3.2.484"
          checkov_bin="$checkov_venv/bin/checkov"
          test -x "$checkov_bin"
          checkov_sha="$(sha256sum "$checkov_bin" | awk '{print $1}')"
          "$checkov_bin" --version | tee "$RUNNER_TEMP/checkov-version.txt"
          grep -F "3.2.484" "$RUNNER_TEMP/checkov-version.txt"

          fixture_root="$RUNNER_TEMP/pathfinder-checkov-fixtures"
          mkdir -p "$fixture_root/vulnerable/rules" "$fixture_root/clean/rules"
          cp testdata/analyzer-fixtures/vulnerable/iac/* "$fixture_root/vulnerable/"
          cp testdata/analyzer-fixtures/clean/iac/* "$fixture_root/clean/"
          cp rules/checkov.yml "$fixture_root/vulnerable/rules/checkov.yml"
          cp rules/checkov.yml "$fixture_root/clean/rules/checkov.yml"

          go run ./cmd/adrctl scan-checkov \
            --root "$fixture_root/vulnerable" \
            --config rules/checkov.yml \
            --binary "$checkov_bin" \
            --binary-sha256 "$checkov_sha" \
            --version 3.2.484 \
            --json-out "$RUNNER_TEMP/checkov-vulnerable.json" \
            --sarif-out "$RUNNER_TEMP/checkov-vulnerable.sarif"

          go run ./cmd/adrctl scan-checkov \
            --root "$fixture_root/clean" \
            --config rules/checkov.yml \
            --binary "$checkov_bin" \
            --binary-sha256 "$checkov_sha" \
            --version 3.2.484 \
            --json-out "$RUNNER_TEMP/checkov-clean.json" \
            --sarif-out "$RUNNER_TEMP/checkov-clean.sarif"

          jq -e '
            .status == "COMPLETE"
            and ([.findings[].rule_id] | index("CKV_AWS_24") != null)
            and ([.findings[].rule_id] | index("CKV_AWS_25") != null)
          ' "$RUNNER_TEMP/checkov-vulnerable.json"

          jq -e '
            .status == "COMPLETE"
            and ([.findings[].rule_id] | index("CKV_AWS_24") == null)
            and ([.findings[].rule_id] | index("CKV_AWS_25") == null)
          ' "$RUNNER_TEMP/checkov-clean.json"

      - name: Verify deterministic analyzer plan and cache invalidation
        run: |
          set -euo pipefail
          plan_root="$RUNNER_TEMP/pathfinder-plan-fixture"
          mkdir -p "$plan_root/src" "$plan_root/rules" "$plan_root/analyzer-evidence"
          cp testdata/analyzer-fixtures/clean/javascript.js "$plan_root/src/app.js"
          cp rules/pathfinder-security.yml "$plan_root/rules/pathfinder-security.yml"

          go run ./cmd/adrctl plan-repo \
            --root "$plan_root" --analyzer opengrep --version 1.30.0 \
            --config rules/pathfinder-security.yml --scope src/ \
            --binary-sha256 35779bdd72e92129c8df2a77f0c55e8c08356801ea92591ef32108d6b28d564c \
            --json-out "$plan_root/analyzer-evidence/plan.json"
          cp "$plan_root/analyzer-evidence/plan.json" "$RUNNER_TEMP/plan-first.json"
          go run ./cmd/adrctl plan-repo \
            --root "$plan_root" --analyzer opengrep --version 1.30.0 \
            --config rules/pathfinder-security.yml --scope src/ \
            --binary-sha256 35779bdd72e92129c8df2a77f0c55e8c08356801ea92591ef32108d6b28d564c \
            --json-out "$plan_root/analyzer-evidence/plan.json"
          cmp "$RUNNER_TEMP/plan-first.json" "$plan_root/analyzer-evidence/plan.json"
          go run ./cmd/adrctl verify-plan --root "$plan_root" --manifest "$plan_root/analyzer-evidence/plan.json"

          old_cache_key="$(jq -er '.tasks[0].cache_key' "$RUNNER_TEMP/plan-first.json")"
          cp "$RUNNER_TEMP/plan-first.json" "$RUNNER_TEMP/plan-stale.json"
          printf '\n// cache invalidation fixture\n' >> "$plan_root/src/app.js"
          go run ./cmd/adrctl plan-repo \
            --root "$plan_root" --analyzer opengrep --version 1.30.0 \
            --config rules/pathfinder-security.yml --scope src/ \
            --binary-sha256 35779bdd72e92129c8df2a77f0c55e8c08356801ea92591ef32108d6b28d564c \
            --json-out "$plan_root/analyzer-evidence/plan.json"
          new_cache_key="$(jq -er '.tasks[0].cache_key' "$plan_root/analyzer-evidence/plan.json")"
          test "$old_cache_key" != "$new_cache_key"
          go run ./cmd/adrctl verify-plan --root "$plan_root" --manifest "$plan_root/analyzer-evidence/plan.json"
          if go run ./cmd/adrctl verify-plan --root "$plan_root" --manifest "$RUNNER_TEMP/plan-stale.json"; then
            echo "stale plan unexpectedly verified" >&2
            exit 1
          fi

          cache_dir="$RUNNER_TEMP/pathfinder-plan-cache"
          execution_json="$plan_root/analyzer-evidence/execution.json"
          sarif_dir="$plan_root/analyzer-evidence/raw"
          go run ./cmd/adrctl execute-plan \
            --root "$plan_root" --manifest "$plan_root/analyzer-evidence/plan.json" \
            --binary "$RUNNER_TEMP/opengrep/opengrep" --cache-dir "$cache_dir" \
            --json-out "$execution_json" --sarif-dir "$sarif_dir"
          jq -e '.status == "COMPLETE" and (.tasks | length) == 1 and all(.tasks[]; .status == "COMPLETE" and .cache_hit == false and (.raw_sarif_path | length) > 0)' "$execution_json"
          go run ./cmd/adrctl execute-plan \
            --root "$plan_root" --manifest "$plan_root/analyzer-evidence/plan.json" \
            --binary "$RUNNER_TEMP/opengrep/opengrep" --cache-dir "$cache_dir" \
            --json-out "$execution_json" --sarif-dir "$sarif_dir"
          jq -e '.status == "COMPLETE" and (.tasks | length) == 1 and all(.tasks[]; .status == "COMPLETE" and .cache_hit == true and .attempts == 0 and (.raw_sarif_path | length) > 0)' "$execution_json"

      - name: Scan repository with OpenGrep and verify cache idempotency
        run: |
          set -euo pipefail
          mkdir -p analyzer-evidence
          go run ./cmd/adrctl scan-opengrep \
            --root . \
            --config rules/pathfinder-security.yml \
            --binary "$RUNNER_TEMP/opengrep/opengrep" \
            --binary-sha256 35779bdd72e92129c8df2a77f0c55e8c08356801ea92591ef32108d6b28d564c \
            --version 1.30.0 \
            --cache-dir "$RUNNER_TEMP/pathfinder-analyzer-cache" \
            --manifest-out analyzer-evidence/run-manifest.json \
            --json-out analyzer-evidence/opengrep.json \
            --sarif-out analyzer-evidence/opengrep.sarif
          cp analyzer-evidence/run-manifest.json "$RUNNER_TEMP/first-run-manifest.json"
          jq -e '.status == "COMPLETE" and (.tasks | length) == 1 and .tasks[0].cached == false and (.manifest_id | length) == 64 and (.tasks[0].cache_key | length) == 64' "$RUNNER_TEMP/first-run-manifest.json"

          go run ./cmd/adrctl scan-opengrep \
            --root . \
            --config rules/pathfinder-security.yml \
            --binary "$RUNNER_TEMP/opengrep/opengrep" \
            --binary-sha256 35779bdd72e92129c8df2a77f0c55e8c08356801ea92591ef32108d6b28d564c \
            --version 1.30.0 \
            --cache-dir "$RUNNER_TEMP/pathfinder-analyzer-cache" \
            --manifest-out analyzer-evidence/run-manifest.json \
            --json-out analyzer-evidence/opengrep.json \
            --sarif-out analyzer-evidence/opengrep.sarif
          first_id="$(jq -r '.manifest_id' "$RUNNER_TEMP/first-run-manifest.json")"
          jq -e --arg first_id "$first_id" '.status == "COMPLETE" and .manifest_id == $first_id and (.tasks | length) == 1 and .tasks[0].cached == true and .tasks[0].status == "COMPLETE"' analyzer-evidence/run-manifest.json

      - name: Verify one-command specification-check quickstart
        run: |
          set -euo pipefail
          registry="$RUNNER_TEMP/pathfinder-quickstart-reviews.json"
          go run ./cmd/adrctl review-init --output "$registry"
          go run ./cmd/adrctl specification-check \
            --root . \
            --source-root testdata/specifications \
            --requirements adr/requirements.json \
            --registry "$registry" \
            --report-only
          jq -e '
            .document_count >= 3
            and .candidate_count >= 9
            and all(.candidates[]; .approval_status == "pending_review" and .executable == false)
            and any(.candidates[]; .statement == "Each service must expose a health endpoint." and .section_heading == "Preamble" and .source_line_start == 3)
            and ([.candidates[] | select(.source_path | contains("outbound-http-client.md"))] | length) >= 4
            and any(.candidates[]; .statement | test("health endpoint|timeout_seconds|COBOL"; "i"))
          ' adr/obligation-candidates.json

      - name: Measure reuse-pilot extraction quality
        run: |
          set -euo pipefail
          go run ./cmd/adrctl ingest-adrs --root testdata/reuse-pilot/adrs --json-out "$RUNNER_TEMP/pilot-ingested.json"
          go run ./cmd/adrctl extract-obligations --index "$RUNNER_TEMP/pilot-ingested.json" --root testdata/reuse-pilot/adrs --json-out "$RUNNER_TEMP/pilot-candidates.json"
          python3 scripts/reuse_pilot_harness.py testdata/reuse-pilot/labels.json "$RUNNER_TEMP/pilot-candidates.json"
          jq -e '.document_count == 120 and .candidate_count >= 120' "$RUNNER_TEMP/pilot-candidates.json"

      - name: Assess repository source
        run: |
          go run ./cmd/adrctl assess-repo \
            --root . \
            --requirements adr/requirements.json \
            --analyzer-evidence analyzer-evidence/opengrep.json \
            --analyzer-sarif analyzer-evidence/opengrep.sarif \
            --report report.md \
            --json-out assessment.json \
            --sarif-out results.sarif
          cat report.md

      - name: Validate SARIF outputs against the pinned 2.1.0 schema
        run: |
          set -euo pipefail
          schema="$RUNNER_TEMP/sarif-schema-2.1.0.json"
          schema_url="https://raw.githubusercontent.com/SchemaStore/schemastore/2aded6096789c43a722556cf5019464ee747e495/src/schemas/json/sarif-2.1.0.json"
          curl --fail --location --silent --show-error "$schema_url" --output "$schema"

          venv="$RUNNER_TEMP/sarif-validation-venv"
          python3 -m venv "$venv"
          "$venv/bin/python" -m pip install --disable-pip-version-check --no-input "jsonschema==4.23.0"
          "$venv/bin/python" scripts/validate_sarif.py \
            --schema "$schema" \
            results.sarif \
            analyzer-evidence/opengrep.sarif

      - name: Install pinned reviewdog CLI
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          go install github.com/reviewdog/reviewdog/cmd/reviewdog@v0.20.3
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Annotate pull request with SARIF findings
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ github.token }}
        run: reviewdog -f=sarif -reporter=github-pr-review -level=warning < results.sarif

      - name: Verify live reviewdog annotation on smoke PR
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && contains(github.event.pull_request.title, '[reviewdog-smoke]')
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          fixture="testdata/analyzer-fixtures/vulnerable/shell_command.go"
          sarif="$RUNNER_TEMP/reviewdog-smoke.sarif"
          opengrep="$RUNNER_TEMP/opengrep/opengrep"

          # This known-positive fixture is excluded from the normal repository
          # scan, so scan only the tracked fixture to produce a targeted SARIF
          # result for this PR's changed line.
          set +e
          "$opengrep" scan --sarif-output="$sarif" -f rules/pathfinder-security.yml "$fixture"
          scan_status=$?
          set -e
          if [ "$scan_status" -gt 1 ]; then
            echo "OpenGrep failed unexpectedly with status $scan_status" >&2
            exit "$scan_status"
          fi

          jq -e --arg fixture "$fixture" '
            any(.runs[].results[];
              .ruleId == "rules.pathfinder.go-shell-command"
              and any(.locations[]; .physicalLocation.artifactLocation.uri == $fixture)
            )
          ' "$sarif"

          reviewdog -f=sarif -reporter=github-pr-review -level=warning < "$sarif"

          comments_url="https://api.github.com/repos/$GH_REPOSITORY/pulls/$PR_NUMBER/comments?per_page=100"
          curl --fail --location --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$comments_url" > "$RUNNER_TEMP/reviewdog-comments.json"

          jq -e --arg fixture "$fixture" '
            any(.[]; .path == $fixture
              and (.body | contains("Avoid invoking a shell with a dynamically supplied command."))
            )
          ' "$RUNNER_TEMP/reviewdog-comments.json"

      - name: Enforce deterministic assessment on pull requests
        if: github.event_name == 'pull_request'
        run: |
          verdict="$(jq -r '.verdict' assessment.json)"
          echo "ADR assessment verdict: $verdict"
          if [ "$verdict" = "FAIL" ] || [ "$verdict" = "INDETERMINATE" ]; then
            echo "ADR compliance is not confirmed; see report.md and SARIF evidence."
            exit 1
          fi

      - name: Upload assessment evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: adr-repository-assessment
          path: |
            assessment.json
            results.sarif
            report.md
            analyzer-evidence/opengrep.json
            analyzer-evidence/opengrep.sarif
            analyzer-evidence/run-manifest.json
          if-no-files-found: error
          retention-days: 14

  arch-go-benchmark:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.27.x'
          cache: false

      - name: Install pinned Arch-Go
        run: |
          go install github.com/arch-go/arch-go/v2@v2.1.0
          "$(go env GOPATH)/bin/arch-go" --help

      - name: Require compliant architecture fixture to pass
        working-directory: testdata/arch-go-benchmark/clean
        run: '"$(go env GOPATH)/bin/arch-go" --color no --json'

      - name: Require forbidden dependency fixture to fail
        working-directory: testdata/arch-go-benchmark/violation
        shell: bash
        run: |
          set -euo pipefail
          if "$(go env GOPATH)/bin/arch-go" --color no --json; then
            echo "Arch-Go unexpectedly accepted domain -> infrastructure dependency"
            exit 1
          else
            echo "Arch-Go correctly rejected the forbidden dependency"
          fi

      - name: Compare with Pathfinder deterministic verifier
        run: |
          set -euo pipefail
          go run ./cmd/adrctl assess \
            --input testdata/pass-issue.md \
            --requirements adr/requirements.json \
            --report "$RUNNER_TEMP/pathfinder-clean.md" \
            --json-out "$RUNNER_TEMP/pathfinder-clean.json" \
            --sarif-out "$RUNNER_TEMP/pathfinder-clean.sarif"
          go run ./cmd/adrctl assess \
            --input testdata/deviation-issue.md \
            --requirements adr/requirements.json \
            --report "$RUNNER_TEMP/pathfinder-violation.md" \
            --json-out "$RUNNER_TEMP/pathfinder-violation.json" \
            --sarif-out "$RUNNER_TEMP/pathfinder-violation.sarif"
          jq -e '.verdict == "PASS"' "$RUNNER_TEMP/pathfinder-clean.json"
          jq -e '.verdict == "FAIL"' "$RUNNER_TEMP/pathfinder-violation.json"
      - name: Upload Arch-Go benchmark reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: arch-go-benchmark-reports
          path: |
            testdata/arch-go-benchmark/clean/.arch-go/report.json
            testdata/arch-go-benchmark/violation/.arch-go/report.json
          if-no-files-found: warn
          retention-days: 14

  conftest-benchmark:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.27.x'
          cache: false

      - name: Install pinned Conftest and verify release checksums
        run: |
          set -euo pipefail
          tool_dir="$RUNNER_TEMP/conftest"
          mkdir -p "$tool_dir"
          archive="conftest_0.71.1_Linux_x86_64.tar.gz"
          release="https://github.com/open-policy-agent/conftest/releases/download/v0.71.1"
          curl --fail --location --silent --show-error "$release/checksums.txt" --output "$tool_dir/checksums.txt"
          echo "5e5d7e2c0e88b3437cb659a921e0b88e997e4e0a49d01be52a9569136f01dbf9  $tool_dir/checksums.txt" | sha256sum --check
          grep -E '^[[:xdigit:]]{64}[[:space:]]+conftest_0\.71\.1_Linux_x86_64\.tar\.gz$' "$tool_dir/checksums.txt" > "$tool_dir/selected-checksum.txt"
          test "$(wc -l < "$tool_dir/selected-checksum.txt")" -eq 1
          curl --fail --location --silent --show-error "$release/$archive" --output "$tool_dir/$archive"
          (cd "$tool_dir" && sha256sum --check selected-checksum.txt)
          tar -xzf "$tool_dir/$archive" -C "$tool_dir"
          "$tool_dir/conftest" --help >/dev/null

      - name: Compare Conftest and Pathfinder on structured JSON policy fixtures
        run: |
          set -euo pipefail
          tool="$RUNNER_TEMP/conftest/conftest"
          policy="testdata/conftest-benchmark/policy"
          fixtures="testdata/conftest-benchmark"
          results="$RUNNER_TEMP/conftest-benchmark-results"
          mkdir -p "$results"

          # The same required-key and timeout-range contract must accept the
          # compliant input and reject the missing retry key / out-of-range timeout.
          "$tool" test --policy "$policy" --output json "$fixtures/clean/config/service.json" > "$results/conftest-clean.json"
          jq -e 'all(.[]; (.failures | length) == 0)' "$results/conftest-clean.json"
          if "$tool" test --policy "$policy" --output json "$fixtures/violation/config/service.json" > "$results/conftest-violation.json"; then
            echo "Conftest unexpectedly accepted missing retry_limit and timeout_seconds=121" >&2
            exit 1
          fi
          jq -e 'any(.[]; (.failures | length) >= 2)' "$results/conftest-violation.json"

          # Run Pathfinder's built-in JSON verifiers against identical files.
          catalog="$PWD/$fixtures/requirements.json"
          for scenario in clean violation; do
            root="$RUNNER_TEMP/pathfinder-json-$scenario"
            mkdir -p "$root/config"
            cp "$fixtures/$scenario/config/service.json" "$root/config/service.json"
            go run ./cmd/adrctl assess-repo \
              --root "$root" \
              --requirements "$catalog" \
              --report "$results/pathfinder-$scenario.md" \
              --json-out "$results/pathfinder-$scenario.json" \
              --sarif-out "$results/pathfinder-$scenario.sarif"
          done
          jq -e '.verdict == "PASS"' "$results/pathfinder-clean.json"
          jq -e '.verdict == "FAIL"' "$results/pathfinder-violation.json"

      - name: Upload Conftest and Pathfinder benchmark outputs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: conftest-json-policy-benchmark
          path: ${{ runner.temp }}/conftest-benchmark-results
          if-no-files-found: warn
          retention-days: 14

      - name: Setup Node.js for Promptfoo and workshop
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            eval/promptfoo/package-lock.json
            workshop/package-lock.json

      - name: Promptfoo offline assist eval (zero provider cost)
        env:
          WORKSHOP_INPUTS: ${{ runner.temp }}/workshop-inputs
        working-directory: eval/promptfoo
        run: |
          set -euo pipefail
          npm ci
          npm run eval:offline
          mkdir -p "$WORKSHOP_INPUTS"
          node ../scripts/summarize_promptfoo.mjs output/results.json "$WORKSHOP_INPUTS/promptfoo.json" offline
          jq -e '.mode == "offline" and .pass_rate == 1' "$WORKSHOP_INPUTS/promptfoo.json"

      - name: Build workshop SPA (typecheck, no deploy)
        working-directory: workshop
        run: |
          set -euo pipefail
          npm ci
          npm run build

      - name: Emit workshop inputs from CI artifacts
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          GIT_SHA: ${{ github.sha }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          set -euo pipefail
          inputs="$RUNNER_TEMP/workshop-inputs"
          mkdir -p "$inputs"
          go run ./cmd/adrctl ingest-adrs --root testdata/adr-corpus --json-out "$inputs/ingested.json"
          go run ./cmd/adrctl extract-obligations --index "$inputs/ingested.json" --root testdata/adr-corpus --json-out "$inputs/candidates.json"
          go run ./cmd/adrctl assist-obligations --index "$inputs/candidates.json" --json-out "$inputs/proposals.json" --provider offline --max-confidence low
          emit_args=(
            --out-dir "$inputs/snapshot"
            --run-id "${RUN_ID}-${RUN_ATTEMPT}"
            --workflow "CI"
            --git-sha "$GIT_SHA"
            --html-url "${SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}"
            --provider-mode offline
            --candidates "$inputs/candidates.json"
            --proposals "$inputs/proposals.json"
            --promptfoo "$inputs/promptfoo.json"
          )
          if [ -f assessment.json ]; then
            cp assessment.json "$inputs/assessment.json"
            emit_args+=(--assessment "$inputs/assessment.json" --enforce-assess-llm)
          fi
          go run ./cmd/adrctl workshop-emit "${emit_args[@]}"
          test -f "$inputs/snapshot/latest.json"

      - name: Upload workshop inputs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: workshop-inputs-ci
          path: ${{ runner.temp }}/workshop-inputs
          if-no-files-found: error
          retention-days: 14
