name: ADR Assessment

on:
  issues:
    types: [opened, edited, reopened]

permissions:
  contents: read

concurrency:
  group: adr-assessment-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  assess:
    if: startsWith(github.event.issue.title, '[ADR Assessment]')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Verify toolchain and catalog
        run: |
          go version
          go test ./...
          go vet ./...
          go run ./cmd/adrctl validate --requirements adr/requirements.json

      - name: Assess issue content without executing submitted code
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          set -euo pipefail
          printf '%s' "$ISSUE_BODY" > issue.md
          requirements="adr/requirements.json"

          # This title-gated fixture exercises explicit human-review semantics
          # through the same issue-to-report pipeline. Ordinary issues always
          # use the repository's unchanged compatibility catalog.
          if [[ "$ISSUE_TITLE" == *"[manual-review-smoke]"* ]]; then
            requirements="$RUNNER_TEMP/requirements-manual-review.json"
            jq '.adrs += [{
              "id": "ADR-E2E-MANUAL-REVIEW",
              "title": "Human review for business semantic constraints",
              "version": 1,
              "status": "accepted",
              "requirements": [{
                "id": "REQ-E2E-MANUAL-REVIEW-01",
                "title": "The timeout must meet the service business latency budget",
                "description": "Whether the configured timeout meets product latency goals requires human judgment.",
                "severity": "warning",
                "verifier": {"type": "manual-review"}
              }]
            }]' adr/requirements.json > "$requirements"
          fi

          go run ./cmd/adrctl assess \
            --input issue.md \
            --requirements "$requirements" \
            --report report.md \
            --json-out assessment.json \
            --sarif-out results.sarif

      - name: Validate issue SARIF against the pinned 2.1.0 schema
        run: |
          set -euo pipefail
          schema="$RUNNER_TEMP/sarif-schema-2.1.0.json"
          schema_url="https://raw.githubusercontent.com/SchemaStore/schemastore/2aded6096789c43a722556cf5019464ee747e495/src/schemas/json/sarif-2.1.0.json"
          curl --fail --location --silent --show-error "$schema_url" --output "$schema"

          venv="$RUNNER_TEMP/sarif-validation-venv"
          python3 -m venv "$venv"
          "$venv/bin/python" -m pip install --disable-pip-version-check --no-input "jsonschema==4.23.0"
          "$venv/bin/python" scripts/validate_sarif.py --schema "$schema" results.sarif

      - name: Publish assessment report to the issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          jq -n --arg body "$(cat report.md)" '{body: $body}' > comment.json
          comments_url="https://api.github.com/repos/$GH_REPOSITORY/issues/$ISSUE_NUMBER/comments"
          existing_id="$(curl --fail-with-body --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" "$comments_url" \
            | jq -r '[.[] | select(.user.login == "github-actions[bot]")][-1].id // empty')"
          if [ -n "$existing_id" ]; then
            curl --fail-with-body --silent --show-error \
              -X PATCH \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$GH_REPOSITORY/issues/comments/$existing_id" \
              --data @comment.json
          else
            curl --fail-with-body --silent --show-error \
              -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" "$comments_url" \
              --data @comment.json
          fi

      - name: Upload machine-readable evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: adr-assessment-${{ github.event.issue.number }}
          path: |
            assessment.json
            results.sarif
            report.md
          if-no-files-found: error
          retention-days: 14

      - name: Assert manual-review status and fail-closed semantics
        if: always() && success() && contains(github.event.issue.title, '[manual-review-smoke]')
        run: |
          set -euo pipefail
          jq -e '
            .verdict == "INDETERMINATE"
            and .runtime_llm_calls == 0
            and .counts["REVIEW_REQUIRED"] == 1
            and any(.requirements[];
              .requirement_id == "REQ-E2E-MANUAL-REVIEW-01"
              and .status == "REVIEW_REQUIRED")
            and any(.requirements[];
              .requirement_id == "REQ-001-01" and .status == "PASS")
            and any(.requirements[];
              .requirement_id == "REQ-001-02" and .status == "PASS")
            and any(.requirements[];
              .requirement_id == "REQ-002-01" and .status == "PASS")
            and any(.requirements[];
              .requirement_id == "REQ-002-02" and .status == "PASS")
          ' assessment.json

      - name: Assert expected verdict for regression issues
        if: always() && success()
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          go run ./cmd/adrctl assert-issue-verdict \
            --title "$ISSUE_TITLE" \
            --assessment assessment.json
