name: ADR Assessment

on:
  issues:
    types: [opened, edited, reopened]

permissions:
  contents: read

concurrency:
  group: adr-assessment-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  assess:
    if: startsWith(github.event.issue.title, '[ADR Assessment]')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    timeout-minutes: 12
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Verify toolchain and catalogs
        run: |
          go version
          ./scripts/go_test.sh
          go vet $(go list ./... | grep -v '/node_modules/')
          go run ./cmd/adrctl validate --requirements adr/requirements.json
          go run ./cmd/adrctl validate --requirements testdata/corpus/requirements.json

      - name: Verify malformed ADR rejection for regression issue
        if: contains(github.event.issue.title, '[malformed-adr-smoke]')
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          set -euo pipefail
          source_root="$RUNNER_TEMP/pathfinder-malformed-adr"
          output="$RUNNER_TEMP/pathfinder-malformed-ingestion.json"
          log="$RUNNER_TEMP/pathfinder-malformed-ingestion.log"
          mkdir -p "$source_root"
          printf '%s' "$ISSUE_BODY" > "$source_root/ADR-malformed.md"

          if go run ./cmd/adrctl ingest-adrs --root "$source_root" --json-out "$output" >"$log" 2>&1; then
            cat "$log"
            echo "Malformed ADR was unexpectedly accepted." >&2
            exit 1
          fi
          cat "$log"
          grep -F "ADR document must contain a level-one title heading" "$log"
          if [ -e "$output" ]; then
            echo "Malformed ADR unexpectedly produced a partial ingestion index." >&2
            exit 1
          fi

      - name: Assess issue against the full OWASP/AWS corpus
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          set -euo pipefail
          printf '%s' "$ISSUE_BODY" > issue.md

          # Default: full 200-ADR corpus pack. Smoke titles keep the small live catalog.
          requirements="testdata/corpus/requirements.json"
          if [[ "$ISSUE_TITLE" == *"[manual-review-smoke]"* ]]; then
            requirements="$RUNNER_TEMP/requirements-manual-review.json"
            jq '.adrs += [{
              "id": "ADR-E2E-MANUAL-REVIEW",
              "title": "Human review for business semantic constraints",
              "version": 1,
              "status": "accepted",
              "requirements": [{
                "id": "REQ-E2E-MANUAL-REVIEW-01",
                "title": "The timeout must meet the service business latency budget",
                "description": "Whether the configured timeout meets product latency goals requires human judgment.",
                "severity": "warning",
                "verifier": {"type": "manual-review"}
              }]
            }]' adr/requirements.json > "$requirements"
          fi

          sandbox="$RUNNER_TEMP/issue-sandbox"
          python3 scripts/issue_sandbox_extract.py --input issue.md --out-dir "$sandbox"
          snippet_count="$(find "$sandbox" -type f ! -name '.pathfinder-sandbox' | wc -l | tr -d ' ')"
          echo "sandbox_snippets=${snippet_count}" >> "$GITHUB_STEP_SUMMARY"
          echo "requirements=${requirements}" >> "$GITHUB_STEP_SUMMARY"

          if [[ "$snippet_count" -gt 0 && "$requirements" == "testdata/corpus/requirements.json" ]]; then
            # Materialize fences and run OpenGrep + Checkov — never execute submitted code.
            install_dir="$RUNNER_TEMP/opengrep"
            mkdir -p "$install_dir"
            curl --fail --location --silent --show-error \
              https://github.com/opengrep/opengrep/releases/download/v1.30.0/opengrep_manylinux_x86 \
              --output "$install_dir/opengrep"
            echo "35779bdd72e92129c8df2a77f0c55e8c08356801ea92591ef32108d6b28d564c  $install_dir/opengrep" | sha256sum --check
            chmod 0755 "$install_dir/opengrep"

            # Dedicated venv: adrctl's ExecCommandRunner isolates HOME, so a pip
            # --user console script under ~/.local/bin cannot import checkov.
            checkov_venv="$RUNNER_TEMP/checkov-venv"
            python3 -m venv "$checkov_venv"
            "$checkov_venv/bin/python" -m pip install --disable-pip-version-check --no-input "checkov==3.2.484"
            checkov_bin="$checkov_venv/bin/checkov"
            test -x "$checkov_bin"
            checkov_sha="$(sha256sum "$checkov_bin" | awk '{print $1}')"

            mkdir -p "$sandbox/rules" analyzer-evidence
            cp rules/pathfinder-security.yml "$sandbox/rules/pathfinder-security.yml"
            cp rules/checkov.yml "$sandbox/rules/checkov.yml"

            go run ./cmd/adrctl scan-opengrep \
              --root "$sandbox" \
              --config rules/pathfinder-security.yml \
              --binary "$install_dir/opengrep" \
              --binary-sha256 35779bdd72e92129c8df2a77f0c55e8c08356801ea92591ef32108d6b28d564c \
              --version 1.30.0 \
              --json-out analyzer-evidence/opengrep.json \
              --sarif-out analyzer-evidence/opengrep.sarif

            go run ./cmd/adrctl scan-checkov \
              --root "$sandbox" \
              --config rules/checkov.yml \
              --binary "$checkov_bin" \
              --binary-sha256 "$checkov_sha" \
              --version 3.2.484 \
              --json-out analyzer-evidence/checkov.json \
              --sarif-out analyzer-evidence/checkov.sarif

            go run ./cmd/adrctl assess-repo \
              --root "$sandbox" \
              --requirements "$requirements" \
              --issue-surface \
              --analyzer-evidence analyzer-evidence/opengrep.json,analyzer-evidence/checkov.json \
              --analyzer-sarif analyzer-evidence/opengrep.sarif,analyzer-evidence/checkov.sarif \
              --report report.md \
              --json-out assessment.json \
              --sarif-out results.sarif
          else
            # Prose-only or smoke catalog: snippet/native assess (no scanners on body).
            go run ./cmd/adrctl assess \
              --input issue.md \
              --requirements "$requirements" \
              --issue-surface \
              --report report.md \
              --json-out assessment.json \
              --sarif-out results.sarif
          fi

      - name: Validate issue SARIF against the pinned 2.1.0 schema
        run: |
          set -euo pipefail
          schema="$RUNNER_TEMP/sarif-schema-2.1.0.json"
          schema_url="https://raw.githubusercontent.com/SchemaStore/schemastore/2aded6096789c43a722556cf5019464ee747e495/src/schemas/json/sarif-2.1.0.json"
          curl --fail --location --silent --show-error "$schema_url" --output "$schema"

          venv="$RUNNER_TEMP/sarif-validation-venv"
          python3 -m venv "$venv"
          "$venv/bin/python" -m pip install --disable-pip-version-check --no-input "jsonschema==4.23.0"
          "$venv/bin/python" scripts/validate_sarif.py --schema "$schema" results.sarif

      - name: Assert JSON and SARIF verdict consistency and zero runtime LLM calls
        run: |
          set -euo pipefail
          jq -e '.runtime_llm_calls == 0' assessment.json
          jq -e --slurpfile assessment assessment.json '
            .runs[0].properties.adrctl.runtime_llm_calls == 0
            and .runs[0].properties.adrctl.verdict == $assessment[0].verdict
            and .runs[0].properties.adrctl.coverage_status == $assessment[0].coverage_status
            and .runs[0].properties.adrctl.requirement_count == $assessment[0].requirement_count
          ' results.sarif

      - name: Emit workshop snapshot inputs
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          GIT_SHA: ${{ github.sha }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          set -euo pipefail
          inputs="$RUNNER_TEMP/workshop-inputs"
          mkdir -p "$inputs"
          cp assessment.json "$inputs/assessment.json"

          # Prefer obligations extracted from the issue body when it is a valid ADR.
          issue_root="$RUNNER_TEMP/issue-adrs"
          mkdir -p "$issue_root"
          printf '%s' "$ISSUE_BODY" > "$issue_root/ADR-ISSUE.md"
          if go run ./cmd/adrctl ingest-adrs --root "$issue_root" --json-out "$inputs/ingested-issue.json" 2>"$inputs/ingest-issue.err"; then
            go run ./cmd/adrctl extract-obligations \
              --index "$inputs/ingested-issue.json" \
              --root "$issue_root" \
              --json-out "$inputs/candidates.json" \
              --min-confidence-report || true
          fi
          # Fall back to the labeled corpus extract so confidence bands are always published.
          if [ ! -f "$inputs/candidates.json" ]; then
            go run ./cmd/adrctl ingest-adrs --root testdata/corpus/adrs --json-out "$inputs/ingested.json"
            go run ./cmd/adrctl extract-obligations \
              --index "$inputs/ingested.json" \
              --root testdata/corpus/adrs \
              --json-out "$inputs/candidates.json" \
              --min-confidence-report
            echo "issue_extract=corpus_fallback" > "$inputs/extract-source.txt"
          else
            echo "issue_extract=issue_body" > "$inputs/extract-source.txt"
          fi

          go run ./cmd/adrctl low-confidence-checklist \
            --index "$inputs/candidates.json" \
            --md-out "$inputs/low-confidence-checklist.md"
          go run ./cmd/adrctl workshop-emit \
            --out-dir "$inputs/snapshot" \
            --run-id "${RUN_ID}-${RUN_ATTEMPT}-issue-${ISSUE_NUMBER}" \
            --workflow "ADR Assessment" \
            --git-sha "$GIT_SHA" \
            --html-url "${SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" \
            --candidates "$inputs/candidates.json" \
            --assessment "$inputs/assessment.json" \
            --corpus-labels testdata/corpus/labels.json \
            --enforce-assess-llm

      - name: Publish assessment report to the issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          WORKSHOP_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name || 'pf_2' }}/
        run: |
          set -euo pipefail
          inputs="$RUNNER_TEMP/workshop-inputs"
          comments_url="https://api.github.com/repos/$GH_REPOSITORY/issues/$ISSUE_NUMBER/comments"
          upsert_comment() {
            local marker="$1"
            local body_file="$2"
            local body
            body="$(printf '%s\n\n%s\n' "$marker" "$(cat "$body_file")")"
            jq -n --arg body "$body" '{body: $body}' > comment.json
            local existing_id
            existing_id="$(curl --fail-with-body --silent --show-error \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" "$comments_url" \
              | jq -r --arg marker "$marker" '[.[] | select(.user.login == "github-actions[bot]" and (.body | contains($marker)))] | .[-1].id // empty')"
            if [ -n "$existing_id" ]; then
              curl --fail-with-body --silent --show-error \
                -X PATCH \
                -H "Accept: application/vnd.github+json" \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "https://api.github.com/repos/$GH_REPOSITORY/issues/comments/$existing_id" \
                --data @comment.json
            else
              curl --fail-with-body --silent --show-error \
                -X POST \
                -H "Accept: application/vnd.github+json" \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "X-GitHub-Api-Version: 2022-11-28" "$comments_url" \
                --data @comment.json
            fi
          }

          marker="<!-- pathfinder-bot-assessment -->"
          {
            cat report.md
            echo
            jq -r --arg url "$WORKSHOP_URL" '
              "## Obligation confidence\n\n" +
              "- High: \(.confidence_summary.high // 0)\n" +
              "- Medium: \(.confidence_summary.medium // 0)\n" +
              "- Low (escalate): \(.confidence_summary.low // 0)\n" +
              "- Runtime LLM calls on assess: must stay **0** (deterministic gate).\n" +
              "- Escalate low-confidence via **LLM Assist** (proposals only; never auto-approved).\n" +
              "- Accept proposals only via `adrctl accept-assist-proposal` after human review.\n" +
              "- Workshop: [\($url)](\($url))\n"
            ' "$inputs/candidates.json"
          } > "$inputs/assessment-comment.md"
          upsert_comment "$marker" "$inputs/assessment-comment.md"

          checklist_marker="<!-- pathfinder-bot-low-confidence-checklist -->"
          upsert_comment "$checklist_marker" "$inputs/low-confidence-checklist.md"

      - name: Upload machine-readable evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: adr-assessment-${{ github.event.issue.number }}
          path: |
            assessment.json
            results.sarif
            report.md
          if-no-files-found: error
          retention-days: 14

      - name: Upload workshop inputs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: workshop-inputs-adr-${{ github.event.issue.number }}
          path: ${{ runner.temp }}/workshop-inputs
          if-no-files-found: error
          retention-days: 14

      - name: Assert manual-review status and fail-closed semantics
        if: always() && success() && contains(github.event.issue.title, '[manual-review-smoke]')
        run: |
          set -euo pipefail
          # Issue/sandbox surface: manual-review is NOT_APPLICABLE so it does not
          # force an indeterminate verdict; live catalog requirements still PASS.
          jq -e '
            .verdict == "PASS"
            and .runtime_llm_calls == 0
            and .counts["NOT_APPLICABLE"] >= 1
            and (.counts["REVIEW_REQUIRED"] // 0) == 0
            and any(.requirements[];
              .requirement_id == "REQ-E2E-MANUAL-REVIEW-01"
              and .status == "NOT_APPLICABLE")
            and any(.requirements[];
              .requirement_id == "REQ-001-01" and .status == "PASS")
            and any(.requirements[];
              .requirement_id == "REQ-001-02" and .status == "PASS")
            and any(.requirements[];
              .requirement_id == "REQ-002-01" and .status == "PASS")
            and any(.requirements[];
              .requirement_id == "REQ-002-02" and .status == "PASS")
          ' assessment.json

      - name: Assert expected verdict for regression issues
        if: always() && success()
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          go run ./cmd/adrctl assert-issue-verdict \
            --title "$ISSUE_TITLE" \
            --assessment assessment.json
