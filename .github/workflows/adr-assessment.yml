name: ADR Assessment

on:
  issues:
    types: [opened, edited, reopened]

permissions:
  contents: read

concurrency:
  group: adr-assessment-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  assess:
    if: startsWith(github.event.issue.title, '[ADR Assessment]')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Verify toolchain and catalog
        run: |
          go version
          go test ./...
          go vet ./...
          go run ./cmd/adrctl validate --requirements adr/requirements.json

      - name: Assess issue content without executing submitted code
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          printf '%s' "$ISSUE_BODY" > issue.md
          go run ./cmd/adrctl assess \
            --input issue.md \
            --requirements adr/requirements.json \
            --report report.md \
            --json-out assessment.json \
            --sarif-out results.sarif

      - name: Publish assessment report to the issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          jq -n --arg body "$(cat report.md)" '{body: $body}' > comment.json
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GH_REPOSITORY/issues/$ISSUE_NUMBER/comments" \
            --data @comment.json

      - name: Upload machine-readable evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: adr-assessment-${{ github.event.issue.number }}
          path: |
            assessment.json
            results.sarif
            report.md
          if-no-files-found: error
          retention-days: 14
