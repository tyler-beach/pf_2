# Pathfinder GitHub App → installation token → reusable PR scan.
# Actions-native MVP: no custom webhook server. The App is installed for
# short-lived tokens; this workflow triggers on pull_request / dispatch.
#
# Secrets (repo or org): APP_ID (or APP_CLIENT_ID), APP_PRIVATE_KEY
# Without App secrets, same-repo scans fall back to GITHUB_TOKEN (notice logged).
# See docs/github-app-design.md for UI create/install checklist.
name: Pathfinder App PR Scan

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      pr_url:
        description: Full GitHub PR URL (defaults to triggering pull_request when event is pull_request)
        required: false
        type: string
      upload_sarif:
        description: Upload Security SARIF to the target repo
        required: false
        type: boolean
        default: false
      catalog:
        description: Requirement catalog
        required: false
        type: choice
        options: [corpus, live]
        default: live
      reporters:
        description: Comma-separated reviewdog reporters
        required: false
        type: string
        default: github-pr-review,github-pr-check

permissions:
  contents: read
  pull-requests: write
  checks: write
  security-events: write

concurrency:
  group: pathfinder-app-pr-scan-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  mint-app-token:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      token: ${{ steps.export.outputs.token }}
      pr_url: ${{ steps.params.outputs.pr_url }}
      upload_sarif: ${{ steps.params.outputs.upload_sarif }}
      catalog: ${{ steps.params.outputs.catalog }}
      reporters: ${{ steps.params.outputs.reporters }}
      auth: ${{ steps.export.outputs.auth }}
    steps:
      - name: Resolve PR URL + reusable inputs
        id: params
        env:
          DISPATCH_PR_URL: ${{ inputs.pr_url }}
          EVENT_PR_URL: ${{ github.event.pull_request.html_url }}
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_UPLOAD: ${{ inputs.upload_sarif }}
          DISPATCH_CATALOG: ${{ inputs.catalog }}
          DISPATCH_REPORTERS: ${{ inputs.reporters }}
        run: |
          set -euo pipefail
          pr_url="${DISPATCH_PR_URL:-}"
          if [[ -z "$pr_url" ]]; then
            pr_url="${EVENT_PR_URL:-}"
          fi
          if [[ -z "$pr_url" ]]; then
            echo "::error::pr_url is required for workflow_dispatch without a pull_request event"
            exit 1
          fi
          {
            echo "pr_url<<PF_EOF"
            printf '%s\n' "$pr_url"
            echo "PF_EOF"
          } >> "$GITHUB_OUTPUT"

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            upload="${DISPATCH_UPLOAD:-false}"
            catalog="${DISPATCH_CATALOG:-live}"
            reporters="${DISPATCH_REPORTERS:-github-pr-review,github-pr-check}"
          else
            upload="false"
            catalog="live"
            reporters="github-pr-review,github-pr-check"
          fi
          case "$upload" in
            true|True|TRUE) upload="true" ;;
            *) upload="false" ;;
          esac
          echo "upload_sarif=$upload" >> "$GITHUB_OUTPUT"
          echo "catalog=$catalog" >> "$GITHUB_OUTPUT"
          {
            echo "reporters<<PF_EOF"
            printf '%s\n' "$reporters"
            echo "PF_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Detect App secrets
        id: check
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_CLIENT_ID: ${{ secrets.APP_CLIENT_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          # Never use secrets.* in job/step `if:` — GitHub blanks them for probes.
          if [[ -n "${APP_PRIVATE_KEY:-}" && ( -n "${APP_ID:-}" || -n "${APP_CLIENT_ID:-}" ) ]]; then
            if [[ -n "${APP_CLIENT_ID:-}" ]]; then
              echo "auth_mode=client_id" >> "$GITHUB_OUTPUT"
            else
              echo "auth_mode=app_id" >> "$GITHUB_OUTPUT"
            fi
            echo "has_app=true" >> "$GITHUB_OUTPUT"
          else
            echo "auth_mode=github_token" >> "$GITHUB_OUTPUT"
            echo "has_app=false" >> "$GITHUB_OUTPUT"
            echo "::notice::App secrets not set — using GITHUB_TOKEN for same-repo scan. Add APP_ID + APP_PRIVATE_KEY (docs/github-app-design.md) for install-token auth."
          fi

      - name: Mint installation token (client-id)
        id: app-token-client
        if: steps.check.outputs.has_app == 'true' && steps.check.outputs.auth_mode == 'client_id'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-checks: write
          permission-pull-requests: write
          permission-contents: read
          permission-security-events: write

      - name: Mint installation token (app-id)
        id: app-token-appid
        if: steps.check.outputs.has_app == 'true' && steps.check.outputs.auth_mode == 'app_id'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-checks: write
          permission-pull-requests: write
          permission-contents: read
          permission-security-events: write

      - name: Export review token
        id: export
        env:
          TOKEN_CLIENT: ${{ steps.app-token-client.outputs.token }}
          TOKEN_APPID: ${{ steps.app-token-appid.outputs.token }}
          FALLBACK: ${{ github.token }}
          HAS_APP: ${{ steps.check.outputs.has_app }}
        run: |
          set -euo pipefail
          if [[ "$HAS_APP" == "true" ]]; then
            token="${TOKEN_CLIENT:-${TOKEN_APPID:-}}"
            auth="app"
            if [[ -z "$token" ]]; then
              echo "::error::Failed to mint GitHub App installation token"
              exit 1
            fi
          else
            token="$FALLBACK"
            auth="github_token"
          fi
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"
          echo "auth=$auth" >> "$GITHUB_OUTPUT"

  scan:
    needs: mint-app-token
    uses: ./.github/workflows/pathfinder-pr-scan-reusable.yml
    with:
      pr_url: ${{ needs.mint-app-token.outputs.pr_url }}
      pathfinder_ref: main
      reporters: ${{ needs.mint-app-token.outputs.reporters }}
      upload_sarif: ${{ needs.mint-app-token.outputs.upload_sarif == 'true' }}
      filter_mode: added
      catalog: ${{ needs.mint-app-token.outputs.catalog }}
      fail_level: any
    secrets:
      review_token: ${{ needs.mint-app-token.outputs.token }}
      sarif_token: ${{ needs.mint-app-token.outputs.token }}
