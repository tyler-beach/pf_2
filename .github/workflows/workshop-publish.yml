name: Workshop Publish

on:
  workflow_run:
    workflows:
      - CI
      - ADR Assessment
      - Labeled corpus evaluation
      - LLM Assist
    types: [completed]
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Optional Actions run id to download workshop-inputs from
        required: false
        default: ""
      snapshot_path:
        description: Optional in-repo snapshot dir (e.g. testdata/workshop-submissions/workshop-snapshot) when no source_run_id
        required: false
        default: ""

permissions:
  contents: write
  pages: write
  id-token: write
  actions: read

concurrency:
  group: workshop-pages
  cancel-in-progress: false

jobs:
  publish:
    # Only auto-publish from trusted same-repo non-PR runs (push/schedule/etc).
    # Fork or same-repo PR artifacts must not reach Pages; operators use workflow_dispatch.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.event != 'pull_request')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: workshop/package-lock.json

      - name: Download workshop-related artifact
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id || github.event.inputs.source_run_id }}
          SNAP_PATH: ${{ github.event.inputs.snapshot_path }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name || 'dispatch' }}
          GIT_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          inputs="$RUNNER_TEMP/workshop-inputs"
          mkdir -p "$inputs/snapshot"

          # Dispatch source_run_id must be digits-only (gh run id).
          if [ -n "${SOURCE_RUN_ID:-}" ] && ! [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::SOURCE_RUN_ID must be a numeric Actions run id"
            exit 1
          fi

          # snapshot_path must resolve under the trusted checkout (no path traversal).
          resolve_snap() {
            local raw="$1"
            local abs
            case "$raw" in
              ""|/*|~*) echo "::error::snapshot_path must be a relative path under the repository"; return 1 ;;
            esac
            if [[ "$raw" == *..* ]]; then
              echo "::error::snapshot_path must not contain '..'"
              return 1
            fi
            abs="$(cd "$GITHUB_WORKSPACE" && realpath -m -- "$raw")"
            case "$abs" in
              "$GITHUB_WORKSPACE"|"$GITHUB_WORKSPACE"/*) ;;
              *) echo "::error::snapshot_path escapes repository root"; return 1 ;;
            esac
            printf '%s' "$abs"
          }

          if [ -z "${SOURCE_RUN_ID:-}" ]; then
            if [ -n "${SNAP_PATH:-}" ]; then
              snap_abs="$(resolve_snap "$SNAP_PATH")"
              if [ -f "${snap_abs}/latest.json" ]; then
                echo "No source run id; using in-repo snapshot ${SNAP_PATH}"
                cp -R "${snap_abs}/." "$inputs/snapshot/"
              else
                echo "::error::snapshot_path ${SNAP_PATH} missing latest.json"
                exit 1
              fi
            else
              echo "No source run id; using fixtures"
              cp -R testdata/workshop-fixtures/. "$inputs/snapshot/"
            fi
            exit 0
          fi
          # Prefer dedicated workshop-inputs artifacts over evidence-only uploads.
          names="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}/artifacts" --jq '.artifacts[].name')"
          pick=""
          for n in $names; do
            case "$n" in
              workshop-inputs*) pick="$n"; break ;;
            esac
          done
          if [ -z "$pick" ]; then
            for n in $names; do
              case "$n" in
                llm-assist-*) pick="$n"; break ;;
              esac
            done
          fi
          if [ -z "$pick" ]; then
            echo "No workshop-inputs artifact on run ${SOURCE_RUN_ID}; using fixtures"
            cp -R testdata/workshop-fixtures/. "$inputs/snapshot/"
            exit 0
          fi
          # Artifact names must match the allowlist literally (no path/metachar surprises).
          case "$pick" in
            workshop-inputs*|llm-assist-*) ;;
            *) echo "::error::refusing unexpected artifact name: $pick"; exit 1 ;;
          esac
          gh run download "$SOURCE_RUN_ID" -n "$pick" -D "$inputs"
          if [ -f "$inputs/snapshot/latest.json" ]; then
            echo "Using pre-built snapshot from artifact $pick"
          elif [ -f "$inputs/candidates.json" ] || [ -f "$inputs/assessment.json" ]; then
            emit=(
              --out-dir "$inputs/snapshot"
              --run-id "${SOURCE_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
              --workflow "$WORKFLOW_NAME"
              --git-sha "$GIT_SHA"
            )
            [ -f "$inputs/candidates.json" ] && emit+=(--candidates "$inputs/candidates.json")
            [ -f "$inputs/proposals.json" ] && emit+=(--proposals "$inputs/proposals.json")
            [ -f "$inputs/promptfoo.json" ] && emit+=(--promptfoo "$inputs/promptfoo.json")
            [ -f "$inputs/assessment.json" ] && emit+=(--assessment "$inputs/assessment.json")
            [ -f "$inputs/harness.json" ] && emit+=(--harness "$inputs/harness.json")
            go run ./cmd/adrctl workshop-emit "${emit[@]}"
          else
            echo "Artifact $pick lacked snapshot inputs; using fixtures"
            cp -R testdata/workshop-fixtures/. "$inputs/snapshot/"
          fi
          test -f "$inputs/snapshot/latest.json"

      - name: Merge into workshop-data layout and push branch
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_RUN_ID: ${{ github.event.workflow_run.id || github.run_id }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/workshop-data-git"
          rm -rf "$work"
          if git ls-remote --exit-code --heads origin workshop-data >/dev/null 2>&1; then
            git clone --single-branch --branch workshop-data \
              "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$work"
          else
            mkdir -p "$work"
            git -C "$work" init
            git -C "$work" checkout -b workshop-data
          fi
          # Append this run onto existing history in the branch working tree.
          python3 scripts/workshop_publish_data.py \
            --snapshot "$RUNNER_TEMP/workshop-inputs/snapshot" \
            --data-dir "$work" \
            --retain-snapshots 180
          # Expose merged data for the site build step.
          rm -rf "$RUNNER_TEMP/workshop-data"
          mkdir -p "$RUNNER_TEMP/workshop-data"
          rsync -a --exclude .git "$work/" "$RUNNER_TEMP/workshop-data/"
          git -C "$work" config user.name "github-actions[bot]"
          git -C "$work" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$work" add -A
          if git -C "$work" diff --cached --quiet; then
            echo "No workshop-data changes"
          else
            git -C "$work" commit -m "workshop-data: publish ${PUBLISH_RUN_ID}"
            git -C "$work" push \
              "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
              HEAD:workshop-data
          fi

      - name: Build workshop site with data
        run: |
          set -euo pipefail
          mkdir -p workshop/public/data
          rsync -a "$RUNNER_TEMP/workshop-data/" workshop/public/data/
          cd workshop
          npm ci
          npm run build

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: workshop/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      - name: Upload snapshot artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: workshop-snapshot-${{ github.run_id }}
          path: ${{ runner.temp }}/workshop-inputs/snapshot
          if-no-files-found: warn
          retention-days: 14
