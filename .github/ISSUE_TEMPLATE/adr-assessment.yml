name: ADR compliance assessment
description: Assess a technical specification or source snippet against the full OWASP Top 10 + AWS corpus (200 ADRs).
title: "[ADR Assessment] "
body:
  - type: markdown
    attributes:
      value: |
        Submissions are checked against **`testdata/corpus/requirements.json`** (200 OWASP/AWS MADRs).

        - Fenced **code snippets** are written to a sandbox and scanned with OpenGrep (never executed).
        - Prose / tech specs are assessed without OpenGrep; analyzer-backed obligations stay indeterminate until code is provided.
        - Successful runs publish a workshop snapshot to GitHub Pages via Workshop Publish.
  - type: dropdown
    id: assessment_mode
    attributes:
      label: Assessment mode
      description: Choose what evidence you are providing.
      options:
        - Implementation snippet
        - Technical specification
        - Both specification and implementation
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Design context
      description: Explain the intended architecture, assumptions, and relevant constraints.
  - type: textarea
    id: source_code
    attributes:
      label: Source code
      description: Use language-tagged fences (python, go, javascript, …). Each fence becomes a sandbox file for OpenGrep vs the corpus.
      value: |
        ```python
        # example — replace with the code under review
        password = "SuperSecretPassword1"
        ```
  - type: textarea
    id: tech_spec
    attributes:
      label: Technical specification / ADR (optional)
      description: Markdown with a level-one title if you want obligation extraction from the issue body.
      value: |
        # ADR-ISSUE: Example decision

        ## Status
        Accepted

        ## Decision
        Services MUST NOT store plaintext credentials in source.
  - type: checkboxes
    id: acknowledgement
    attributes:
      label: Acknowledgement
      options:
        - label: I understand submitted code is not executed, and results cover the corpus pack (OpenGrep + manual-review obligations).
          required: true
