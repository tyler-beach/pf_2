rules:
  - id: pathfinder.owasp-debug-mode-python
    message: "Debug/development mode enabled in application configuration"
    languages: [python]
    severity: WARNING
    pattern-either:
      - pattern: DEBUG = True
      - pattern: debug = True

  - id: pathfinder.owasp-debug-mode-javascript
    message: "Debug mode enabled in JavaScript/TypeScript configuration"
    languages: [javascript, typescript]
    severity: WARNING
    patterns:
      - pattern-either:
          - pattern: "{..., debug: true, ...}"
          - pattern: "{..., DEBUG: true, ...}"

  - id: pathfinder.owasp-git-dependency-npm
    message: "Direct Git dependency URL in package manifest"
    languages: [json]
    severity: ERROR
    pattern-regex: '"(git\+|github:|gitlab:|bitbucket:|git://|https?://[^"]+\.git[#@])'

  - id: pathfinder.owasp-git-dependency-gomod
    message: "Unpinned or replace-based Git module dependency"
    languages: [generic]
    severity: ERROR
    pattern-regex: '(?m)^(replace\s+\S+|require\s+\S+)\s+.*(github\.com|gitlab\.com)/[^\s]+\s+v0\.0\.0-[0-9a-f]+'

  - id: pathfinder.owasp-log-secret-python
    message: "Potential secret or credential written to logs"
    languages: [python]
    severity: WARNING
    pattern-either:
      - pattern: logging.$METHOD($MSG, password)
      - pattern: logging.$METHOD($MSG, secret)
      - pattern: logging.$METHOD($MSG, token)
      - pattern: logging.$METHOD(password)
      - pattern: logger.$METHOD(password)
      - pattern: logger.$METHOD(secret)
      - pattern: print(password)
      - pattern: print(secret)

  - id: pathfinder.owasp-log-secret-javascript
    message: "Potential secret written to logs"
    languages: [javascript, typescript]
    severity: WARNING
    pattern-either:
      - pattern: console.log(password)
      - pattern: console.log(secret)
      - pattern: console.log(token)
      - pattern: console.log(..., password, ...)
      - pattern: console.log(..., secret, ...)
      - pattern: logger.info(password)
      - pattern: logger.debug(secret)

  - id: pathfinder.aws-iam-create-access-key
    message: "Creating long-term IAM user access keys in application code"
    languages: [python]
    severity: ERROR
    pattern-either:
      - pattern: $CLIENT.create_access_key(...)
      - pattern: $CLIENT.create_access_key_pair(...)

  - id: pathfinder.aws-cloudtrail-stop-logging
    message: "Stopping CloudTrail logging from application code"
    languages: [python]
    severity: ERROR
    pattern: $CLIENT.stop_logging(...)

  - id: pathfinder.owasp-rate-limit-disabled-python
    message: "Rate limiting disabled or set to unbounded (0/None)"
    languages: [python]
    severity: WARNING
    pattern-either:
      - pattern: rate_limit = None
      - pattern: RATE_LIMIT = None
      - pattern: rate_limit = 0
      - pattern: RATE_LIMIT = 0
      - pattern: max_requests_per_minute = 0
      - pattern: RATE_LIMIT_ENABLED = False

  - id: pathfinder.owasp-lockout-disabled-python
    message: "Account lockout threshold disabled or unbounded"
    languages: [python]
    severity: WARNING
    pattern-either:
      - pattern: lockout_threshold = None
      - pattern: LOCKOUT_THRESHOLD = None
      - pattern: lockout_threshold = 0
      - pattern: max_failed_attempts = 0
      - pattern: ACCOUNT_LOCKOUT_ENABLED = False

  - id: pathfinder.owasp-untrusted-plugin-import-python
    message: "Loading a plugin or extension module from a filesystem path (untrusted plugin boundary)"
    languages: [python]
    severity: ERROR
    pattern-either:
      - pattern: importlib.machinery.SourceFileLoader($NAME, $PATH).load_module()
      - pattern: importlib.util.spec_from_file_location($NAME, $PATH)
      - pattern: plugin_manager.load_plugin($PATH)
      - pattern: load_plugin($PATH)

  - id: pathfinder.owasp-untrusted-plugin-require-javascript
    message: "Dynamic require/import of a non-literal plugin path (untrusted extension host boundary)"
    languages: [javascript, typescript]
    severity: ERROR
    pattern-either:
      - patterns:
          - pattern: require($PATH)
          - pattern-not: require("...")
      - patterns:
          - pattern: import($PATH)
          - pattern-not: import("...")
      - pattern: pluginLoader.load($PATH)
      - pattern: loadPlugin($PATH)

  - id: pathfinder.owasp-curl-pipe-shell
    message: "Pipeline installs software via curl|shell (breaks CI provenance / integrity)"
    languages: [bash, yaml]
    severity: ERROR
    pattern-regex: 'curl\s+[^\n|;]*\|\s*(sudo\s+)?(ba)?sh'
